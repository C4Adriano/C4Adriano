<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>C4Adriano — Repositórios</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700&display=swap"
            rel="stylesheet" />
        <style>
            :root {
                --bg: #0d0f13;
                --surface: #13161c;
                --border: #1f2330;
                --accent: #4ade80;
                --accent2: #22d3ee;
                --text: #e2e8f0;
                --muted: #64748b;
                --danger: #f87171;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: "JetBrains Mono", monospace;
                min-height: 100vh;
                padding: 2rem 1rem 4rem;
            }

            /* ── header ── */
            header {
                max-width: 900px;
                margin: 0 auto 2.5rem;
                border-bottom: 1px solid var(--border);
                padding-bottom: 1.5rem;
            }

            .prompt {
                font-size: 0.75rem;
                color: var(--muted);
                margin-bottom: 0.4rem;
            }

            .prompt span {
                color: var(--accent);
            }

            h1 {
                font-family: "Syne", sans-serif;
                font-size: clamp(1.6rem, 4vw, 2.4rem);
                font-weight: 700;
                letter-spacing: -0.5px;
            }

            h1 em {
                font-style: normal;
                color: var(--accent);
            }

            .subtitle {
                margin-top: 0.4rem;
                font-size: 0.8rem;
                color: var(--muted);
            }

            /* ── status bar ── */
            #status {
                max-width: 900px;
                margin: 0 auto 1.2rem;
                font-size: 0.75rem;
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            #status .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--muted);
                flex-shrink: 0;
            }

            #status.loaded .dot {
                background: var(--accent);
            }
            #status.error .dot {
                background: var(--danger);
            }

            /* ── filter ── */
            #filter-bar {
                max-width: 900px;
                margin: 0 auto 1rem;
                display: flex;
                gap: 0.5rem;
                flex-wrap: wrap;
            }

            #search {
                flex: 1;
                min-width: 160px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 4px;
                color: var(--text);
                font-family: inherit;
                font-size: 0.8rem;
                padding: 0.45rem 0.75rem;
                outline: none;
                transition: border-color 0.2s;
            }

            #search:focus {
                border-color: var(--accent);
            }
            #search::placeholder {
                color: var(--muted);
            }

            /* ── table ── */
            .table-wrap {
                max-width: 900px;
                margin: 0 auto;
                overflow-x: auto;
                border: 1px solid var(--border);
                border-radius: 6px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.82rem;
            }

            thead th {
                background: var(--surface);
                padding: 0.65rem 1rem;
                text-align: left;
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                white-space: nowrap;
            }

            tbody tr {
                border-bottom: 1px solid var(--border);
                transition: background 0.15s;
            }

            tbody tr:last-child {
                border-bottom: none;
            }
            tbody tr:hover {
                background: var(--surface);
            }

            td {
                padding: 0.7rem 1rem;
                vertical-align: middle;
            }

            /* nome do repo */
            .repo-name {
                font-weight: 600;
                color: var(--accent2);
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }

            .repo-name:hover {
                text-decoration: underline;
            }

            .repo-name svg {
                flex-shrink: 0;
                opacity: 0.6;
            }

            /* descrição */
            .repo-desc {
                color: var(--text);
                font-size: 0.78rem;
                opacity: 0.85;
                max-width: 320px;
            }

            .repo-desc.empty {
                color: var(--muted);
                font-style: italic;
            }

            /* linguagem */
            .lang-dot {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 4px;
                vertical-align: middle;
                flex-shrink: 0;
            }

            .lang-cell {
                display: flex;
                align-items: center;
                white-space: nowrap;
                color: var(--text);
                gap: 2px;
            }

            /* estrelas / forks */
            .stats-cell {
                display: flex;
                gap: 0.8rem;
                white-space: nowrap;
                color: var(--muted);
            }

            .stat {
                display: flex;
                align-items: center;
                gap: 3px;
            }

            /* pages link */
            .pages-link {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 0.75rem;
                color: var(--accent);
                text-decoration: none;
                border: 1px solid var(--accent);
                border-radius: 3px;
                padding: 2px 7px;
                white-space: nowrap;
                transition:
                    background 0.15s,
                    color 0.15s;
            }

            .pages-link:hover {
                background: var(--accent);
                color: var(--bg);
            }

            .no-pages {
                color: var(--border);
                font-size: 0.75rem;
            }

            /* empty / loading row */
            .row-info td {
                text-align: center;
                padding: 2.5rem;
                color: var(--muted);
                font-size: 0.8rem;
            }

            /* skeleton animation */
            @keyframes shimmer {
                0% {
                    opacity: 0.3;
                }
                50% {
                    opacity: 0.7;
                }
                100% {
                    opacity: 0.3;
                }
            }

            .skeleton {
                animation: shimmer 1.4s ease-in-out infinite;
            }
        </style>
    </head>
    <body>
        <header>
            <p class="prompt">$ <span>ls ~/repos</span></p>
            <h1>C4<em>Adriano</em></h1>
            <p class="subtitle">repositórios públicos &mdash; uso pessoal</p>
        </header>

        <div id="status">
            <span class="dot"></span>
            <span id="status-text">buscando repositórios…</span>
        </div>

        <div id="filter-bar">
            <input id="search" type="text" placeholder="filtrar por nome ou descrição…" autocomplete="off" />
        </div>

        <div class="table-wrap">
            <table id="repo-table">
                <thead>
                    <tr>
                        <th>Repositório</th>
                        <th>Descrição</th>
                        <th>Linguagem</th>
                        <th>⭐ / 🍴</th>
                        <th>Pages</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr class="row-info skeleton">
                        <td colspan="5">carregando…</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script>
            // ── cores por linguagem (mesmo esquema do GitHub) ──
            const LANG_COLORS = {
                JavaScript: "#f1e05a",
                TypeScript: "#3178c6",
                Python: "#3572A5",
                HTML: "#e34c26",
                CSS: "#563d7c",
                Shell: "#89e051",
                Java: "#b07219",
                "C++": "#f34b7d",
                C: "#555555",
                Ruby: "#701516",
                Go: "#00ADD8",
                Rust: "#dea584",
                PHP: "#4F5D95",
                default: "#8b949e"
            };

            function langColor(lang) {
                return LANG_COLORS[lang] || LANG_COLORS.default;
            }

            // ── ícone de repo (SVG inline) ──
            const ICON_REPO = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 010-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
  </svg>`;

            const ICON_STAR = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
  </svg>`;

            const ICON_FORK = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
    <path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
  </svg>`;

            const ICON_LINK = `<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
    <path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"/>
  </svg>`;

            // ── busca repos ──
            const USERNAME = "C4Adriano";
            const API_URL = `https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`;

            let allRepos = [];

            async function fetchRepos() {
                const res = await fetch(API_URL, {
                    headers: { Accept: "application/vnd.github+json" }
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            }

            // verifica se o repo tem GitHub Pages ativo
            // (heurística: has_pages flag da API)
            function pagesUrl(repo) {
                if (!repo.has_pages) return null;
                // repos com nome igual ao padrão username.github.io ficam na raiz
                if (repo.name.toLowerCase() === `${USERNAME.toLowerCase()}.github.io`) {
                    return `https://${USERNAME}.github.io/`;
                }
                return `https://${USERNAME}.github.io/${repo.name}/`;
            }

            function buildRow(repo) {
                const pages = pagesUrl(repo);

                const tr = document.createElement("tr");
                tr.dataset.name = repo.name.toLowerCase();
                tr.dataset.desc = (repo.description || "").toLowerCase();

                // nome
                const tdName = document.createElement("td");
                const a = document.createElement("a");
                a.className = "repo-name";
                a.href = repo.html_url;
                a.target = "_blank";
                a.rel = "noopener";
                a.innerHTML = ICON_REPO + repo.name;
                tdName.appendChild(a);

                // descrição
                const tdDesc = document.createElement("td");
                const p = document.createElement("p");
                p.className = "repo-desc" + (repo.description ? "" : " empty");
                p.textContent = repo.description || "sem descrição";
                tdDesc.appendChild(p);

                // linguagem
                const tdLang = document.createElement("td");
                if (repo.language) {
                    const div = document.createElement("div");
                    div.className = "lang-cell";
                    div.innerHTML = `<span class="lang-dot" style="background:${langColor(repo.language)}"></span>${repo.language}`;
                    tdLang.appendChild(div);
                } else {
                    tdLang.innerHTML = `<span style="color:var(--muted)">—</span>`;
                }

                // stars / forks
                const tdStats = document.createElement("td");
                tdStats.innerHTML = `
      <div class="stats-cell">
        <span class="stat">${ICON_STAR} ${repo.stargazers_count}</span>
        <span class="stat">${ICON_FORK} ${repo.forks_count}</span>
      </div>`;

                // pages
                const tdPages = document.createElement("td");
                if (pages) {
                    tdPages.innerHTML = `<a class="pages-link" href="${pages}" target="_blank" rel="noopener">${ICON_LINK} abrir</a>`;
                } else {
                    tdPages.innerHTML = `<span class="no-pages">—</span>`;
                }

                tr.append(tdName, tdDesc, tdLang, tdStats, tdPages);
                return tr;
            }

            function renderRepos(repos) {
                const tbody = document.getElementById("tbody");
                tbody.innerHTML = "";

                if (repos.length === 0) {
                    tbody.innerHTML = '<tr class="row-info"><td colspan="5">nenhum resultado encontrado</td></tr>';
                    return;
                }

                const frag = document.createDocumentFragment();
                repos.forEach((r) => frag.appendChild(buildRow(r)));
                tbody.appendChild(frag);
            }

            function setStatus(state, text) {
                const el = document.getElementById("status");
                el.className = state;
                document.getElementById("status-text").textContent = text;
            }

            // ── filtro ──
            document.getElementById("search").addEventListener("input", function () {
                const q = this.value.toLowerCase().trim();
                const filtered = q
                    ? allRepos.filter(
                          (r) => r.name.toLowerCase().includes(q) || (r.description || "").toLowerCase().includes(q)
                      )
                    : allRepos;
                renderRepos(filtered);
            });

            // ── init ──
            (async () => {
                try {
                    const repos = await fetchRepos();
                    // exclui o próprio repo de perfil (C4Adriano/C4Adriano)
                    allRepos = repos.filter((r) => r.name !== USERNAME);
                    renderRepos(allRepos);
                    setStatus(
                        "loaded",
                        `${allRepos.length} repositório${allRepos.length !== 1 ? "s" : ""} carregado${allRepos.length !== 1 ? "s" : ""}`
                    );
                } catch (err) {
                    setStatus("error", `erro ao buscar repositórios: ${err.message}`);
                    document.getElementById("tbody").innerHTML =
                        '<tr class="row-info"><td colspan="5">não foi possível carregar os repositórios. Tente novamente.</td></tr>';
                }
            })();
        </script>
    </body>
</html>
